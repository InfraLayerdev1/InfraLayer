[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "infralayer"
version = "0.2.0"
description = "InfraLayer Python SDK - Pre-LLM security filtering, sanitization, and telemetry client"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "InfraLayer Team", email = "team@infralayer.io"}
]
maintainers = [
    {name = "InfraLayer Team", email = "team@infralayer.io"}
]
keywords = ["security", "llm", "sanitization", "prompt-injection", "rag", "pre-llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.2.0",
    "python-jose>=3.3.0",
    "cryptography>=42.0.5,<50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]

[tool.poetry]
name = "infralayer"
version = "0.2.0"
description = "InfraLayer Python SDK - Pre-LLM security filtering, sanitization, and telemetry client"
authors = ["InfraLayer Team <team@infralayer.io>"]
license = "MIT"
readme = "README.md"
packages = [{include = "infralayer", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
httpx = ">=0.27.0"
pydantic = ">=2.7.0"
tenacity = ">=8.2.0"
python-jose = ">=3.3.0"
cryptography = ">=42.0.5,<50.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=4.1.0"
black = ">=24.0.0"
ruff = ">=0.4.0"
mypy = ">=1.9.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20", "PTH", "SIM", "RET"]
ignore = ["E501", "ANN101", "ANN102", "ANN201", "ANN202", "T201", "T203"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.poetry.scripts]
infralayer = "infralayer.cli:main"