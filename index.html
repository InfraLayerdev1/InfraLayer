<!DOCTYPE html>
<html>

<body>

<h2>Company AI Assistant</h2>

<p>Ask questions about company documents and policies.</p>

<input id="q" placeholder="Ask something">
<button onclick="ask()">Send</button>

<div id="chat"></div>

<script>

const API =
"http://careers-materials-posts-trigger.trycloudflare.com/api/v1/prediction/1ee561da-6b7c-4ff5-a983-2d91d86b15b5";


async function ask(){

let q = document.getElementById("q").value;

document.getElementById("chat").innerHTML +=
"<p><b>You:</b> " + q + "</p>";


let res = await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question:q
})
});


let data = await res.json();


document.getElementById("chat").innerHTML +=
"<p><b>AI:</b> " + data.text + "</p>";

}

</script>

</body>

</html>
